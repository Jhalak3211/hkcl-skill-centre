<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="60%" stop-color="#14376f" />
      <stop offset="100%" stop-color="#1a4690" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg4)"/>

  <!-- Director's office graphic -->
  <g opacity="0.88" transform="translate(300, 160)">
    <!-- Certificate frames on wall -->
    <rect x="80" y="40" width="100" height="70" rx="6" fill="#0e2a55" stroke="#f4b63d" stroke-width="2"/>
    <rect x="250" y="40" width="100" height="70" rx="6" fill="#0e2a55" stroke="#f4b63d" stroke-width="2"/>
    <rect x="420" y="40" width="100" height="70" rx="6" fill="#0e2a55" stroke="#f4b63d" stroke-width="2"/>

    <!-- Desk -->
    <rect x="80" y="240" width="440" height="110" rx="12" fill="#0a1f40" stroke="#3a6fbe" stroke-width="3"/>
    <rect x="60" y="230" width="480" height="20" rx="10" fill="#2459a8"/>
    <!-- Laptop on desk -->
    <rect x="230" y="195" width="140" height="80" rx="6" fill="#070c18" stroke="#5f8ed2" stroke-width="2"/>
    <rect x="210" y="245" width="180" height="8" rx="4" fill="#a0c4f8"/>
  </g>

  <text x="600" y="660" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="34" fill="#ffffff">Director's Office &amp; Career Counselling</text>
  <text x="600" y="705" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="18" fill="#a0c4f8">Individual Student Mentorship &amp; Guidance</text>
</svg>
