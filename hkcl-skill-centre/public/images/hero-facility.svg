<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f40" />
      <stop offset="50%" stop-color="#1a4690" />
      <stop offset="100%" stop-color="#2459a8" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg5)"/>

  <!-- Building / Centre graphic -->
  <g opacity="0.9" transform="translate(350, 150)">
    <rect x="50" y="40" width="400" height="320" rx="16" fill="#070c18" stroke="#5f8ed2" stroke-width="4"/>
    <!-- Windows matrix -->
    <rect x="90" y="80" width="70" height="60" rx="6" fill="#5f8ed2" opacity="0.8"/>
    <rect x="215" y="80" width="70" height="60" rx="6" fill="#f4b63d" opacity="0.8"/>
    <rect x="340" y="80" width="70" height="60" rx="6" fill="#5f8ed2" opacity="0.8"/>

    <rect x="90" y="170" width="70" height="60" rx="6" fill="#5f8ed2" opacity="0.8"/>
    <rect x="215" y="170" width="70" height="60" rx="6" fill="#5f8ed2" opacity="0.8"/>
    <rect x="340" y="170" width="70" height="60" rx="6" fill="#f4b63d" opacity="0.8"/>

    <!-- Entrance -->
    <rect x="180" y="270" width="140" height="90" rx="8" fill="#14376f" stroke="#3a6fbe" stroke-width="2"/>
    <text x="250" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">ENTRANCE</text>
  </g>

  <text x="600" y="660" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="34" fill="#ffffff">Modern Learning Facility on Barnala Road</text>
  <text x="600" y="705" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="18" fill="#a0c4f8">1st Floor, RK Hotel Building, Opposite Lenskart • Sirsa</text>
</svg>
