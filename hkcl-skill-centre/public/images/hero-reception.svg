<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0e2a55" />
      <stop offset="100%" stop-color="#14376f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3a6fbe" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#070c18" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Reception desk graphic -->
  <g opacity="0.9" transform="translate(250, 180)">
    <!-- Back wall HKCL logo plaque -->
    <rect x="250" y="40" width="200" height="80" rx="16" fill="#14376f" stroke="#f4b63d" stroke-width="3"/>
    <text x="350" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff">HKCL</text>
    <text x="350" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#f4b63d">SKILL CENTRE</text>

    <!-- Reception desk -->
    <path d="M100 240 L600 240 L560 360 L140 360 Z" fill="#0e2a55" stroke="#3a6fbe" stroke-width="4"/>
    <rect x="80" y="225" width="540" height="20" rx="10" fill="#2459a8"/>
    <!-- Front panel accent -->
    <rect x="200" y="270" width="300" height="60" rx="8" fill="#14376f" stroke="#5f8ed2" stroke-width="2"/>
    <text x="350" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#dde8f8">Information &amp; Admissions Desk</text>
  </g>

  <!-- Overlay text -->
  <text x="600" y="660" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="34" fill="#ffffff">HKCL-Branded Reception &amp; Admissions</text>
  <text x="600" y="705" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="18" fill="#a0c4f8">1st Floor, Barnala Road • Sirsa, Haryana</text>
</svg>
