<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f40" />
      <stop offset="50%" stop-color="#14376f" />
      <stop offset="100%" stop-color="#1a4690" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5f8ed2" />
      <stop offset="100%" stop-color="#2459a8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3a6fbe" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1f40" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Computer lab graphic -->
  <g opacity="0.85" transform="translate(180, 150)">
    <!-- Main center monitor -->
    <rect x="260" y="100" width="320" height="200" rx="16" fill="#070c18" stroke="#5f8ed2" stroke-width="4"/>
    <rect x="274" y="114" width="292" height="152" rx="8" fill="url(#screen)"/>
    <!-- Code lines on monitor -->
    <rect x="294" y="134" width="140" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
    <rect x="294" y="154" width="200" height="8" rx="4" fill="#f4b63d" opacity="0.9"/>
    <rect x="294" y="172" width="160" height="8" rx="4" fill="#ffffff" opacity="0.7"/>
    <rect x="294" y="190" width="220" height="8" rx="4" fill="#a0c4f8" opacity="0.8"/>
    <rect x="294" y="208" width="110" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
    <!-- Stand -->
    <path d="M400 300 L440 300 L450 350 L390 350 Z" fill="#3a6fbe"/>
    <rect x="360" y="348" width="120" height="14" rx="7" fill="#2459a8"/>
    <!-- Keyboard -->
    <rect x="300" y="374" width="240" height="24" rx="6" fill="#14376f" stroke="#3a6fbe" stroke-width="2"/>

    <!-- Left monitor -->
    <rect x="40" y="160" width="200" height="130" rx="12" fill="#070c18" stroke="#3a6fbe" stroke-width="3"/>
    <rect x="50" y="170" width="180" height="96" rx="6" fill="#1a4690"/>
    <path d="M130 290 L150 290 L155 330 L125 330 Z" fill="#2459a8"/>
    <rect x="110" y="328" width="60" height="10" rx="5" fill="#14376f"/>

    <!-- Right monitor -->
    <rect x="600" y="160" width="200" height="130" rx="12" fill="#070c18" stroke="#3a6fbe" stroke-width="3"/>
    <rect x="610" y="170" width="180" height="96" rx="6" fill="#1a4690"/>
    <path d="M690 290 L710 290 L715 330 L685 330 Z" fill="#2459a8"/>
    <rect x="670" y="328" width="60" height="10" rx="5" fill="#14376f"/>
  </g>

  <!-- Overlay text -->
  <text x="600" y="660" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#ffffff">Advanced Computer Laboratory</text>
  <text x="600" y="705" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" fill="#a0c4f8">HKCL Skill Centre • Sirsa, Haryana</text>
</svg>
