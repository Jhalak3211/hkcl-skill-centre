<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f40" />
      <stop offset="50%" stop-color="#14376f" />
      <stop offset="100%" stop-color="#2459a8" />
    </linearGradient>
    <radialGradient id="glow3" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5f8ed2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1f40" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  <rect width="1200" height="800" fill="url(#glow3)"/>

  <!-- Classroom smart board graphic -->
  <g opacity="0.9" transform="translate(300, 150)">
    <!-- Big projector screen / smart interactive board -->
    <rect x="50" y="60" width="500" height="260" rx="16" fill="#070c18" stroke="#3a6fbe" stroke-width="4"/>
    <rect x="70" y="80" width="460" height="220" rx="10" fill="#0e2a55"/>

    <!-- Lesson visual on smart board -->
    <text x="300" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="22" fill="#ffffff">HS-CIT &amp; HCOC Smart Classroom</text>
    <rect x="120" y="170" width="100" height="80" rx="8" fill="#14376f" stroke="#5f8ed2" stroke-width="2"/>
    <rect x="250" y="170" width="100" height="80" rx="8" fill="#14376f" stroke="#f4b63d" stroke-width="2"/>
    <rect x="380" y="170" width="100" height="80" rx="8" fill="#14376f" stroke="#34a853" stroke-width="2"/>
    <text x="170" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#ffffff">IT Skills</text>
    <text x="300" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#f4b63d">MS 365</text>
    <text x="430" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#ffffff">Typing</text>

    <!-- Student workstations in foreground -->
    <rect x="40" y="360" width="140" height="15" rx="6" fill="#3a6fbe"/>
    <rect x="230" y="360" width="140" height="15" rx="6" fill="#3a6fbe"/>
    <rect x="420" y="360" width="140" height="15" rx="6" fill="#3a6fbe"/>
  </g>

  <text x="600" y="660" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="34" fill="#ffffff">Interactive Smart Classrooms &amp; Live Training</text>
  <text x="600" y="705" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="18" fill="#a0c4f8">Audio-Visual Teaching in English &amp; Hindi</text>
</svg>
