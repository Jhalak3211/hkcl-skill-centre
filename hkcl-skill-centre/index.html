<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14376f" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hkcl_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <title>%SITE_NAME% | %SITE_TAGLINE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph / social sharing. Add an og:image once you have a 1200x630 image. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_NAME% | %SITE_TAGLINE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This website needs JavaScript. Please enable it, or call the centre to enquire.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
